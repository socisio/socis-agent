name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for SOCIS — traces conversations, LLM calls, and tool usage. Opt-in via `socis plugins enable observability/langfuse` or `socis tools → Langfuse Observability`."
author: SOCIS
requires_env:
  - SOCIS_AGENT_LANGFUSE_PUBLIC_KEY
  - SOCIS_AGENT_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_finalize
  - on_session_end
  - subagent_start
  - subagent_stop
