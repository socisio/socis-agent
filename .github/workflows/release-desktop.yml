name: Release Desktop

# Builds SOCIS Agent Desktop installers for macOS, Windows and Linux and
# attaches them to a GitHub Release.
#
# Each OS must build on its own runner: electron-builder can only produce a
# .dmg on macOS (it needs hdiutil) and .msi/.nsis on Windows (it needs the
# WiX/NSIS toolchain). Cross-compiling those from Linux is not supported.
#
# Triggered by pushing a tag (`git tag v0.1.0 && git push --tags`) or manually
# from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true
        type: string

# Action versions: GitHub is retiring the Node 20 action runtime, so every
# action here is pinned to a major that declares `runs.using: node24`.
#   checkout        v5
#   setup-node      v5
#   upload-artifact v6  <- NOT v5. v5 only had *preliminary* node24 support and
#                          still defaulted to node20, so it does not clear the
#                          deprecation warning.
#   download-artifact v8
#   action-gh-release v3  (v2.6.2 was the final Node 20 release, unmaintained)
#
# upload v6 + download v8 interoperate: every artifact action from v4 up shares
# the same backend. One behavioural change in download v8 — it now ERRORS on a
# hash mismatch where v4 only warned. Safe here because we upload and download
# within the same workflow run, so the artifacts cannot have been altered.
permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # Don't cancel the other platforms when one fails — a Windows toolchain
      # hiccup shouldn't throw away a good macOS build.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifacts: 'apps/desktop/release/*.dmg,apps/desktop/release/*.zip'
          - os: windows-latest
            platform: win
            artifacts: 'apps/desktop/release/*.exe,apps/desktop/release/*.msi'
          - os: ubuntu-latest
            platform: linux
            artifacts: 'apps/desktop/release/*.AppImage,apps/desktop/release/*.deb,apps/desktop/release/*.rpm'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          # electron-builder stamps the build with the commit; a shallow
          # checkout leaves write-build-stamp.mjs with no SHA to record.
          fetch-depth: 0

      # Resolve the branch this tag lives on, and the exact commit. The tag
      # checkout above leaves a DETACHED HEAD, and the bootstrap installer's
      # build.rs derives its pin from `git rev-parse --abbrev-ref HEAD` — which
      # returns the literal string "HEAD" when detached, so it emits NO branch
      # pin. With no commit pin either, the shipped installer has no pin at all
      # and the install it creates ends up on a detached checkout with no
      # origin/main remote-tracking ref. `socis update` then dies with:
      #   "Branch 'main' does not exist locally or on origin"
      # Baking both pins explicitly is what makes an installed app updatable.
      - name: Resolve build pins
        id: pins
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          # Which branches contain this tag's commit? Prefer main.
          branch="$(git branch -r --contains "$commit" \
                     | sed 's|.*origin/||' | grep -v '^HEAD' \
                     | grep -x main || true)"
          if [ -z "$branch" ]; then
            branch="$(git branch -r --contains "$commit" \
                       | sed 's|.*origin/||' | grep -v '^HEAD' \
                       | head -n1 | tr -d ' ')"
          fi
          [ -n "$branch" ] || branch="main"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Pinning installer to $branch @ $commit"

      # Export signing credentials ONLY when they actually exist.
      #
      # `env: CSC_LINK: ${{ secrets.CSC_LINK }}` looks harmless but defines the
      # variable as an EMPTY STRING when the secret is unset — and electron-
      # builder treats "defined but empty" as "here is a certificate path",
      # resolves it against the cwd, and dies with:
      #   • empty password will be used for code signing
      #   ⨯ .../apps/desktop not a file
      # Writing to $GITHUB_ENV conditionally leaves them genuinely absent, so
      # electron-builder takes its unsigned path and after-pack.mjs ad-hoc
      # signs instead.
      # Artifact filenames come from package.json / Cargo.toml, NOT the git tag.
      # A v0.1.1 tag with 0.0.1 still in src-tauri/Cargo.toml produced installers
      # named "SOCIS-0.0.1-..." — published under the wrong version with no
      # warning. Fail here instead: a red build is cheap, a mislabelled release
      # is not.
      - name: Verify version matches tag
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          want="${tag#v}"
          python3 scripts/set-version.py --check
          have="$(python3 -c "import json;print(json.load(open('apps/desktop/package.json'))['version'])")"
          if [ "$have" != "$want" ]; then
            echo "::error::Tag $tag expects version $want but the repo says $have."
            echo "Run: python3 scripts/set-version.py $want   (then commit and re-tag)"
            exit 1
          fi
          echo "Version $have matches tag $tag"

      - name: Configure signing
        shell: bash
        env:
          IN_CSC_LINK: ${{ secrets.CSC_LINK }}
          IN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IN_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          IN_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          IN_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IN_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          IN_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$IN_CSC_LINK" ]; then
            {
              echo "CSC_LINK=$IN_CSC_LINK"
              echo "CSC_KEY_PASSWORD=$IN_CSC_KEY_PASSWORD"
              echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
            } >> "$GITHUB_ENV"
            echo "macOS: Developer ID signing enabled"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "macOS: no certificate — ad-hoc signing (Gatekeeper prompt expected)"
          fi
          if [ -n "$IN_APPLE_API_KEY" ] && [ -n "$IN_APPLE_API_KEY_ID" ] \
             && [ -n "$IN_APPLE_API_ISSUER" ]; then
            {
              echo "APPLE_API_KEY=$IN_APPLE_API_KEY"
              echo "APPLE_API_KEY_ID=$IN_APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$IN_APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
            echo "macOS: notarization enabled"
          else
            echo "macOS: notarization skipped (Apple API credentials not set)"
          fi
          if [ -n "$IN_WIN_CSC_LINK" ]; then
            {
              echo "WIN_CSC_LINK=$IN_WIN_CSC_LINK"
              echo "WIN_CSC_KEY_PASSWORD=$IN_WIN_CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Windows: signing enabled"
          else
            echo "Windows: unsigned (SmartScreen prompt expected)"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      # Linux needs the rpm tooling for the .rpm target; the other two
      # platforms bundle what they need with electron-builder.
      - name: Install Linux packaging deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # Full install (not --ignore-scripts): electron's postinstall downloads
      # the platform binary, and node-pty / get-windows compile natively.
      - name: Install dependencies
        run: npm ci

      # macOS: build each architecture in its OWN electron-builder invocation.
      #
      # Do NOT collapse these into `--mac --arm64 --x64`. scripts/before-pack.mjs
      # re-stages node-pty into the SHARED dist/node_modules/node-pty directory
      # for each target arch; running both arches through one invocation lets
      # the second staging overwrite the first, and the packaged app ships
      # without its prebuild:
      #   Error: Failed to load native module: pty.node,
      #   Cannot find module './prebuilds/darwin-arm64//pty.node'
      # Two sequential builds keep each stage-then-pack pair atomic.
      #
      # Both arches are needed: macos-latest is Apple Silicon, so building only
      # the host arch would ship no Intel package at all.
      - name: Build installers (macOS arm64)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        run: npm run build && npm run builder -- --mac --arm64
        env:
          SOCIS_AGENT_BUILD_PIN_BRANCH: ${{ steps.pins.outputs.branch }}
          SOCIS_AGENT_BUILD_PIN_COMMIT: ${{ steps.pins.outputs.commit }}

      - name: Build installers (macOS x64)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        run: npm run build && npm run builder -- --mac --x64
        env:
          SOCIS_AGENT_BUILD_PIN_BRANCH: ${{ steps.pins.outputs.branch }}
          SOCIS_AGENT_BUILD_PIN_COMMIT: ${{ steps.pins.outputs.commit }}

      - name: Build installers
        if: matrix.platform != 'mac'
        working-directory: apps/desktop
        run: npm run dist:${{ matrix.platform }}
        env:
          # Baked into the bootstrap installer by src-tauri/build.rs so the
          # install it produces tracks a real branch and can self-update.
          SOCIS_AGENT_BUILD_PIN_BRANCH: ${{ steps.pins.outputs.branch }}
          SOCIS_AGENT_BUILD_PIN_COMMIT: ${{ steps.pins.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: socis-desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    # Publish whatever built, even if one platform failed — a partial release
    # beats no release, and the missing platform can be re-run and re-uploaded.
    if: always() && needs.build.result != 'cancelled'

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List collected installers
        run: ls -la dist/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
