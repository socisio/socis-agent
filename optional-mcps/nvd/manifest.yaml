# SOCIS-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: nvd
description: >-
  CVE detail, CVSS scoring and keyword search from the NIST NVD database.
# NAMED `nvd`, NOT `cve-lookup`.
#
# Tool names are prefixed with the entry name, so `cve-lookup` produced
# `mcp__cve_lookup__search_cves`. The Shodan entry (`attack-surface`) exposes a
# tool of its own literally called `cve_lookup`, giving
# `mcp__attack_surface__cve_lookup` — so the string "cve_lookup" appeared both
# as a server name here and as a tool name there.
#
# That was not theoretical. Asked to search NVD, the model listed
# `mcp__attack_surface__cve_lookup` twice, could not work out which server did
# what, and concluded it had no suitable tool — then fell back to web_search.
# `nvd` is unambiguous: it names the authoritative source and collides with
# nothing.
# First-party: written and maintained by SOCIS. Unlike the other community
# entries there is no upstream to track — see the age-rule note below.
source: https://github.com/socisio/socis-mcp-servers

transport:
  type: stdio
  command: node
  # Plain ESM JavaScript — no TypeScript, no build step, so src/ is the
  # shipped artefact (package.json `main`).
  args:
    - "${INSTALL_DIR}/servers/nvd/src/index.js"

# Runs with no credential. The optional NVD key only changes the rate limit.
auth:
  type: api_key
  env:
    - name: NVD_API_KEY
      description: "Optional NVD API key. Free at nvd.nist.gov/developers/request-an-api-key. Raises the limit from 5 to 50 requests per 30 seconds."
      required: false

install:
  type: git
  url: https://github.com/socisio/socis-mcp-servers.git
  # AGE RULE DELIBERATELY WAIVED — read before treating this as precedent.
  #
  # The >=2-week pin age exists because a freshly-pushed commit is what a
  # compromised third-party maintainer account produces, and two weeks is the
  # window in which the community notices. That threat model does not apply
  # here: this is first-party code, authored and pushed by SOCIS, reviewed in
  # this repository before the push. There is no upstream maintainer to be
  # compromised.
  #
  # The waiver is specific to first-party repositories. It must not be
  # extended to community servers, where the rule is doing real work — see
  # MCP-IMPLEMENTATION-TRACKING.md for the axios case that proves the point.
  # v1.3.0 — search_cves takes a date window (default 120 days, NVD's maximum
  # span) and sorts newest-first.
  #
  # Two bugs fixed here, and the second was a correction to the first.
  #
  # 1. No date filter at all. NVD returns keyword results in its own ordering,
  #    roughly CVE-ID ascending, so searching "FortiOS" returned CVE-2005-1837
  #    through CVE-2014-2216 and nothing from this decade. The tool could not
  #    answer the most common question an analyst asks.
  #
  # 2. The first fix used lastModStartDate, reasoning that a re-scored CVE
  #    matters even if published years ago. True in principle, wrong in
  #    practice: NVD is bulk re-enriching its backlog, so a last-modified
  #    window floods with 2005-2016 CVEs whose metadata was touched by
  #    housekeeping. v1.3.0 defaults to pubStartDate — newly PUBLISHED
  #    vulnerabilities — and keeps the re-scored view behind `by_modified`.
  #
  # Both were found by running the tool and reading what came back, not by
  # reading the code. Worth remembering before assuming a model is ignoring a
  # tool: check the tool can answer the question being asked.
  ref: 605a24b809624c4fd9a58147d154b7b1d225237a
  bootstrap:
    - "cd servers/nvd && npm install"
    # Clear transitive advisories before the build.
    #
    # This is needed even for a server declaring ONE dependency. threat-intel
    # declares only @modelcontextprotocol/sdk ^1.29.0 and still resolved 96
    # packages with 6 advisories (3 high) — hono, body-parser, fast-uri,
    # ip-address, qs. The MCP TypeScript SDK itself pulls an HTTP server stack
    # for its Streamable-HTTP transport; a stdio server never opens a listener,
    # so most of it is unreachable, but it is still vulnerable code on disk and
    # a customer's `npm audit` will report it.
    #
    # No --force: audit fix without it is limited to semver-compatible updates.
    # `npm run build` runs after, so an incompatible fix fails the install
    # loudly rather than shipping a broken server.
    - "cd servers/nvd && npm audit fix"

# NOT installed from npm. The registry still carries 1.0.2, which predates the
# security review: it has no NVD_API_KEY support, falls back to web scraping
# without telling the caller that CWE and reference data are missing, and
# throws a raw TypeError on a missing argument. Pin git until 1.1.0 is
# published, then this can become `npx -y nvd-cve-mcp-server@1.1.0` and the
# install block can go away entirely.

suggest:
  keywords:
    - cve
    - cvss
    - vulnerability lookup
    - nvd
  hosts:
    - nvd.nist.gov

post_install: |
  Works immediately with no credential.

  Strongly recommended: set NVD_API_KEY. NVD limits anonymous callers to 5
  requests per 30 seconds; a free key raises that to 50. You will hit the
  anonymous limit during ordinary triage.

  What happens when you do: the server falls back to scraping the NVD web
  page, which returns no CWE classification and no reference links. That
  fallback now announces itself at the top of the report — but the data is
  still incomplete, so the key is worth the two minutes.

  Free, instant: https://nvd.nist.gov/developers/request-an-api-key

  All requests go to nvd.nist.gov only. No customer data leaves your
  environment; CVE IDs are public identifiers.

  Searching: `search_cves` returns CVEs PUBLISHED in the last 120 days by
  default, newest first — so "recent vulnerabilities in X" works as asked.

  Two options worth knowing:
    recent_days: 0     all-time search. NVD's own ordering applies, which
                       surfaces the OLDEST matches first.
    by_modified: true  filter by last-modified instead. Catches CVEs whose
                       CVSS was re-scored — but NVD is re-enriching its
                       backlog, so this also returns many 2005-2016 entries
                       whose metadata changed for housekeeping reasons.

  Restart the session so the tools load.
