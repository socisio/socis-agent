# SOCIS-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: domain-permutation
description: >-
  Typosquat and lookalike-domain discovery for a brand, via dnstwist.
# Upstream project. MIT requires the copyright and permission notice travel
# with the work — see optional-mcps/NOTICE.
#
# Canonical path; BurtTheCoder/mcp-dnstwist redirects here (account rename).
#
# TWO REASONS THIS ENTRY IS ON HOLD.
#
# 1. It requires Docker. The server runs `docker pull elceef/dnstwist` and
#    shells out to the container rather than calling a local binary — so it
#    fails outright on any host without a running daemon. Confirmed in
#    testing: every lookup returned "failed to connect to the docker API".
#
# 2. MAINTENANCE STATUS: last pushed 2025-03-03 — roughly 18 months before this
#    entry was written. It clears the >=2 week age rule trivially, but the more
# useful reading is the opposite one: this project is effectively unmaintained,
# so no security or dependency fixes are coming from upstream. That is
# acceptable here because the server is a thin read-only wrapper around a local
# dnstwist run with a small dependency surface, and because
# .github/workflows/upstream-watch.yml will surface any advisory that does
# appear. It would NOT be acceptable for anything holding SIEM credentials.
source: https://github.com/w0h1v/mcp-dnstwist

transport:
  type: stdio
  command: node
  args:
    - "${INSTALL_DIR}/build/index.js"

# No API key: dnstwist queries public DNS and WHOIS.
auth:
  type: none

install:
  type: git
  url: https://github.com/w0h1v/mcp-dnstwist.git
  # Full commit SHA. Repository last pushed 2025-03-03; see the maintenance
  # note above before bumping this pin — a bump should be accompanied by a
  # fresh look at whether the project is still alive.
  ref: af62d09328f762a3581cd354997299ed0a758c11
  bootstrap:
    - "npm install"
    - "npm run build"

suggest:
  keywords:
    - typosquat
    - lookalike domain
    - dnstwist
    - phishing domain

post_install: |
  REQUIRES DOCKER — not a pip install.

  This server does not use a local `dnstwist` binary. It shells out to Docker
  and runs the `elceef/dnstwist` image, pulling it on first use:

      docker pull elceef/dnstwist

  So Docker must be installed AND the daemon running. Without it, every lookup
  fails with:

      failed to connect to the docker API at unix:///.../docker.sock
      check if the path is correct and if the daemon is running

  Start Docker Desktop (or `dockerd` on Linux) before using these tools, and
  pre-pull the image if you want the first lookup to be fast rather than a
  silent several-hundred-megabyte download.

  No API credential is needed — dnstwist queries public DNS and WHOIS.

  Permutation results are candidates, not findings. Most generated domains are
  unregistered, and many registered ones are defensive registrations by the
  brand itself or unrelated businesses with similar names. Confirm
  registration, resolution and content before treating any hit as hostile —
  reporting a legitimate company as a phishing domain is its own kind of
  incident.

  Restart the session so the tools load.
