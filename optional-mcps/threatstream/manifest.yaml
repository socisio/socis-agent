# SOCIS-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: threatstream
description: >-
  Anomali ThreatStream indicator reputation, actor attribution and campaigns.
source: https://www.anomali.com/resources/videos/anomali-threatstream-mcp-server-installation-guide

# Vendor-official (Anomali). Reached through the mcp-remote stdio bridge rather
# than `type: http`, because ThreatStream authenticates with
# `Authorization: Api-Key <user>:<key>` — the catalog's http+api_key path emits
# `Bearer` and TransportSpec has no headers field to override it.
#
# The bridge has a second benefit worth stating: auth.env puts the credential
# in ~/.socis-agent/.env, where it is prompted for and masked, instead of
# sitting in plaintext in a config file. During testing this credential was
# leaked in a screenshot of mcp.json — exactly the failure mode this avoids.
transport:
  type: stdio
  command: npx
  args:
    - "-y"
    - "mcp-remote"
    - "https://optic.threatstream.com/mcp"
    # http-only is REQUIRED, and its absence is what produced the 406 this
    # entry was blocked on for a day.
    #
    # mcp-remote defaults to `http-first`: it POSTs to the endpoint, and then
    # separately opens a GET SSE stream for server-to-client messages. The POST
    # works against ThreatStream. The SSE GET returns 406 Not Acceptable —
    # Anomali's endpoint does not serve that stream — and mcp-remote treats
    # that as fatal even though the connection it needs already succeeded:
    #
    #     StreamableHTTPError: Failed to open SSE stream: Not Acceptable
    #       at StreamableHTTPClientTransport._startOrAuthSse
    #       code: 406
    #
    # `--transport http-only` skips the SSE attempt entirely and the proxy
    # establishes normally. Do not remove it to "simplify" the args.
    - "--transport"
    - "http-only"
    - "--header"
    - "Authorization:${THREATSTREAM_AUTH_HEADER}"

auth:
  type: api_key
  env:
    - name: THREATSTREAM_AUTH_HEADER
      description: 'Literally "Api-Key <username>:<api-key>" — include the words Api-Key, the space, and the colon between username and key.'
      required: true

suggest:
  keywords:
    - threatstream
    - anomali
    - threat actor
    - campaign attribution
  hosts:
    - threatstream.com
    - anomali.com

post_install: |
  Set THREATSTREAM_AUTH_HEADER to the COMPLETE header value — the scheme, a
  space, then username and key separated by a colon:

      Api-Key you@company.com:your-api-key

  Not just the credential. Without the `Api-Key ` prefix the server sees no
  auth scheme, returns 401, and mcp-remote falls back to OAuth discovery —
  which fails with a confusing "Invalid OAuth error response" rather than
  anything mentioning credentials. The username is normally your account
  email.

  Credentials: ThreatStream credentials are issued by Anomali, not
  self-service. Contact your Anomali representative if you do not have them.
  Set THREATSTREAM_AUTH_HEADER to the full string `Api-Key user:key` —
  including the words "Api-Key", the space, and the colon.

  Note on tenancy: a ThreatStream key is tied to an organisation. In an MSSP
  context, confirm which tenant's intelligence the key reaches before using it
  across customer investigations — carrying one customer's observables into
  another's context is the kind of mistake that ends an engagement.

  Restart the session so the tools load.
