# SOCIS-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: ioc-reputation
description: >-
  VirusTotal reputation for files, URLs, IPs and domains, with relationships.
# Upstream project. Required: MIT's one condition is that the copyright and
# permission notice travel with the work. See optional-mcps/NOTICE.
#
# NOTE THE PATH. This project is widely referenced as
# "BurtTheCoder/mcp-virustotal"; that now redirects to w0h1v/mcp-virustotal.
#
# This looks like an account RENAME, not a transfer to a third party: the
# package.json still declares `author: BurtTheCoder`, npm scope
# `@burtthecoder/mcp-virustotal`, and mcpName `io.github.BurtTheCoder/virustotal`.
# A new owner would almost certainly have rewritten those. So the code is the
# same author's — but the canonical URL is recorded here regardless, because a
# redirect is controlled by whoever holds the old namespace and can be
# re-pointed later. Attribution in optional-mcps/NOTICE credits BurtTheCoder.
source: https://github.com/socisio/socis-mcp-servers

transport:
  type: stdio
  command: node
  args:
    - "${INSTALL_DIR}/servers/ioc-reputation/build/index.js"

auth:
  type: api_key
  env:
    - name: VIRUSTOTAL_API_KEY
      description: "VirusTotal API key — free tier at virustotal.com/gui/my-apikey. Public keys are rate-limited to 4 lookups/min."
      required: true

install:
  type: git
  url: https://github.com/socisio/socis-mcp-servers.git
  # Full commit SHA, never a tag or branch. Captured 2026-09-06; the repository's
  # last push was 2026-05-24, so this commit is ~105 days old and clears the
  # >=2 week supply-chain rule with room to spare.
  #
  # An npm package also exists — `@burtthecoder/mcp-virustotal@1.0.25`, whose
  # scope matches the declared author, so it is not a name-squat. `npx -y` on a
  # pinned version would skip the build step. The git pin is kept anyway: a
  # commit SHA is content-addressed and cannot be altered, which is the
  # guarantee the catalog's supply-chain policy is built around.
  ref: 7c8aa4d541f4c3ad82899e4cecad922d4623ea82
  # `npm run build` is `tsc && chmod +x build/index.js`, producing the
  # build/index.js referenced above (confirmed from package.json `main`).
  #
  # AXIOS OVERRIDE — do not remove without re-checking the advisories.
  #
  # Upstream declares `"axios": ">=1.4.0 <1.14.1"`. That upper bound reads as a
  # deliberate response to the 2026-03-31 npm supply-chain attack, in which the
  # axios maintainer account was compromised and 1.14.1 / 0.30.4 were published
  # carrying a RAT (both since pulled from the registry). Sensible at the time.
  #
  # The side effect is that the range now resolves to at most 1.14.0, which is
  # vulnerable to:
  #   CVE-2026-40175 / GHSA-fvcv-3m26-pcqx  CVSS 9.9  prototype-pollution
  #       gadget escalating to RCE / AWS IMDSv2 bypass   fixed 1.15.0
  #   CVE-2025-62718   proxy resolution path             fixed 1.15.x
  #   CVE-2026-67312   uncontrolled recursion            fixed 1.18.0
  #   CVE-2026-67315   0.0.0.0 not treated as loopback   fixed 1.18.0
  #
  # 1.18.0 clears all four and is above the compromised 1.14.1, so upgrading
  # does not walk back into the malicious release. The bump is within the 1.x
  # line; if the build breaks, that is the signal to revisit rather than to
  # silently drop this line.
  #
  # Re-verify at every pin bump: upstream may widen the range themselves, in
  # which case this override becomes unnecessary rather than wrong.
  bootstrap:
    - "cd servers/ioc-reputation && npm install"
    # Clear transitive advisories before the build (see the ordering note below).
    #
    # This server declares four dependencies; npm resolves ~190 packages,
    # because fastmcp pulls a complete HTTP SERVER stack (hono, @hono/node-server,
    # koa, express-rate-limit, body-parser, path-to-regexp) for its HTTP
    # transport mode. This server runs stdio and never opens a listener, so most
    # of that is dead code — but it is dead VULNERABLE code, and a customer
    # running `npm audit` on a SOCIS install will not care that the paths are
    # unreachable.
    #
    # Measured on a clean install: 14 advisories (1 critical, 9 high) before,
    # 11 (0 critical, 8 high) after the axios pin, 0 after `npm audit fix`.
    # No --force: every fix npm offered here was semver-compatible, and --force
    # is free to make breaking major bumps. If a future fix is not compatible,
    # `npm run build` below fails loudly rather than shipping a broken server.
    # Order matters. Break the axios cap FIRST so `npm audit fix` can see an
    # unconstrained range, then let audit fix resolve everything else — and
    # potentially bump axios further within ^1, which is desirable.
    #
    # A CARET, not --save-exact. Upstream's mistake was an upper bound
    # (">=1.7.8 <1.14.1") that froze axios below the fix for CVE-2026-40175.
    # Replacing it with an exact pin would recreate the same trap one version
    # later, and would let a later `npm audit fix` be undone by this step.
    - "cd servers/ioc-reputation && npm install axios@^1.18.0"
    - "cd servers/ioc-reputation && npm audit fix"
    - "cd servers/ioc-reputation && npm run build"

suggest:
  keywords:
    - virustotal
    - file reputation
    - hash lookup
  hosts:
    - virustotal.com

post_install: |
  Get a free API key at virustotal.com/gui/my-apikey and supply it as
  VIRUSTOTAL_API_KEY. The free tier allows 4 lookups per minute, which is
  fine for interactive triage and too slow for bulk enrichment.

  DO NOT SUBMIT CUSTOMER DATA.

  Hashes and public indicators are safe to look up. Files, and URLs containing
  session tokens or internal hostnames, are NOT: submitting them to VirusTotal
  publishes them, and anyone with a paid account can then retrieve them. That
  has leaked real customer data for other organisations. Look up hashes;
  detonate elsewhere.

  Also note a clean result is not a verdict. Novel and targeted malware is
  clean by definition, and a low detection count on a recently-submitted
  sample is much weaker evidence than the same count on an old one.

  Restart the session so the tools load.
