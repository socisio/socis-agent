# SOCIS-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: splunk
description: >-
  Run SPL searches and read index metadata from your Splunk deployment.
source: https://help.splunk.com/en/splunk-cloud-platform/mcp-server-for-splunk-platform

# Vendor-official (Splunk LLC, Splunkbase app 7931). The endpoint is per-stack
# — your Splunk administrator provides it from the Splunk MCP Server app — so
# the URL below is a placeholder that MUST be changed after install. The
# catalog cannot template it: transport.url is a fixed string and only
# ${INSTALL_DIR} is substituted.
#
# Splunk uses `Authorization: Bearer <token>`, which is exactly what the
# catalog's http+api_key path emits, so this can be a native HTTP transport
# with no mcp-remote bridge.
transport:
  type: http
  url: https://CHANGE-ME.splunkcloud.com/mcp

auth:
  type: api_key
  env:
    - name: MCP_SPLUNK_API_KEY
      description: "Encrypted Splunk token generated by the Splunk MCP Server app. Sent as an Authorization: Bearer header."
      required: true

suggest:
  keywords:
    - splunk
    - spl
    - search index
  hosts:
    - splunkcloud.com
    - splunk.com

post_install: |
  Prerequisites, in order:

  1. A Splunk administrator installs and configures the Splunk MCP Server app
     (Splunkbase 7931) on your stack. Splunk Cloud Platform 10.3.2512.11 or
     later; app 1.2.1 or later.
  2. They give you the MCP endpoint URL — it is shown in the app, along with a
     sample configuration.
  3. Set that URL in mcp_servers.splunk.url in ~/.socis-agent/config.yaml.
     The placeholder above will not connect.
  4. Generate an encrypted token in the app and set it as MCP_SPLUNK_API_KEY.

  Searches honour your existing Splunk RBAC — the MCP server does not widen
  access, so you see exactly the indexes your Splunk role already permits.
  That is the right boundary, and worth confirming with the customer rather
  than assuming: a token issued from an over-privileged Splunk account gives
  the agent that account's reach.

  On OAuth: Splunk Cloud 10.5.2506.3 and later default to OAuth 2.1, which
  avoids a long-lived token entirely. If your stack supports it, prefer that —
  change auth.type to oauth in the manifest and drop the token.

  A note on cost: SPL searches consume Splunk resources and, on some licences,
  count against search quotas. An agent that iterates over queries can be
  expensive. Scope searches with an index and a time range.

  Restart the session so the tools load.
