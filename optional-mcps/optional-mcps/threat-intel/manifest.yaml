# SOCIS-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: threat-intel
description: >-
  IOC reputation and threat context from OTX, AbuseIPDB, GreyNoise and abuse.ch.
# Upstream project. Required: MIT's one condition is that the copyright and
# permission notice travel with the work. See optional-mcps/NOTICE.
source: https://github.com/aplaceforallmystuff/mcp-threatintel

transport:
  type: stdio
  command: node
  args:
    - "cd servers/threat-intel && ${INSTALL_DIR}/servers/threat-intel/dist/index.js"

# Four independent sources, every key optional. The server enables tools per
# key present, and abuse.ch's Feodo Tracker works with no credential at all —
# so a user who configures nothing still gets something back. That matters:
# the ioc-enrichment skill is written to query whatever is connected and note
# what is missing, rather than failing when a source is absent.
auth:
  type: api_key
  env:
    - "cd servers/threat-intel && name: OTX_API_KEY"
      description: "AlienVault OTX — free at otx.alienvault.com. Enables IOC pulses and campaign context."
      required: false
    - "cd servers/threat-intel && name: ABUSEIPDB_API_KEY"
      description: "AbuseIPDB — free at abuseipdb.com. Enables IP reputation and report history."
      required: false
    - "cd servers/threat-intel && name: GREYNOISE_API_KEY"
      description: "GreyNoise — free community tier. Classifies internet background noise vs targeted activity."
      required: false
    - "cd servers/threat-intel && name: ABUSECH_AUTH_KEY"
      description: "abuse.ch — free at auth.abuse.ch. REQUIRED, not just a rate-limit raise: without it URLhaus, MalwareBazaar and ThreatFox all return HTTP 401 and contribute nothing to an enrichment."
      required: false

install:
  type: git
  url: https://github.com/socisio/socis-mcp-servers.git
  # Full commit SHA, never a tag or branch — tags move, SHAs do not. Verified
  # 2026-08-09, 28 days old at pin time, against the >=2 week supply-chain rule
  # applied to pyproject and npm dependencies. A freshly-pushed commit is what
  # a compromised maintainer account produces; the delay is the window in which
  # the community notices.
  #
  # An npm package `mcp-threatintel-server` also exists and would avoid the
  # build step, but it has NOT been verified as published by the same author.
  # npm name-squatting on a GitHub project is a known supply-chain pattern, so
  # the git pin is used until that is confirmed.
  ref: 48b02bb9f8b426359812475e20a8a485cc070f93
  bootstrap:
    - "cd servers/threat-intel && npm install"
    # Clear transitive advisories before the build.
    #
    # This is needed even for a server declaring ONE dependency. threat-intel
    # declares only @modelcontextprotocol/sdk ^1.29.0 and still resolved 96
    # packages with 6 advisories (3 high) — hono, body-parser, fast-uri,
    # ip-address, qs. The MCP TypeScript SDK itself pulls an HTTP server stack
    # for its Streamable-HTTP transport; a stdio server never opens a listener,
    # so most of it is unreachable, but it is still vulnerable code on disk and
    # a customer's `npm audit` will report it.
    #
    # No --force: audit fix without it is limited to semver-compatible updates.
    # `npm run build` runs after, so an incompatible fix fails the install
    # loudly rather than shipping a broken server.
    - "cd servers/threat-intel && npm audit fix"
    - "cd servers/threat-intel && npm run build"

suggest:
  keywords:
    - "cd servers/threat-intel && abuseipdb"
    - "cd servers/threat-intel && greynoise"
    - "cd servers/threat-intel && threatfox"
    - "cd servers/threat-intel && urlhaus"
  hosts:
    - "cd servers/threat-intel && otx.alienvault.com"
    - "cd servers/threat-intel && abuseipdb.com"
    - "cd servers/threat-intel && greynoise.io"
    - "cd servers/threat-intel && abuse.ch"

post_install: |
  Every credential is optional — configure the sources you have. With none,
  abuse.ch Feodo Tracker still works from its public feeds.

  Free keys: otx.alienvault.com, abuseipdb.com, greynoise.io (community tier),
  auth.abuse.ch.

  KNOWN BUG (upstream): threatintel_lookup_hash returns
  `otx: API error 404: endpoint not found` for every hash. Verified 2026-09-09
  that the OTX API itself is fine — /api/v1/indicators/file/<sha256>/general
  and /analysis both return 200 with a valid key — so the server is requesting
  a path that does not exist. OTX hash enrichment does not work through this
  server; use VirusTotal (ioc-reputation) for hashes until upstream fixes it.
  Note the failure reads as "404 not found", which is easy to mistake for
  "OTX has no data on this hash".

  All lookups are read-only against public reputation services. Nothing is
  submitted or published. Restart the session so the tools load.
